name: Code Checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: false

jobs:
  check:
    name: Code Checks
    # Fork pull requests must not run this job: it compiles and tests the
    # checked-out tree on runners that live inside our network. The sub-minute
    # commit-message and PR-title gates stay open to forks on purpose -- they
    # execute no pull request code and hold no secrets (the PR-title caller does
    # check the tree out on the farm lane, by the 2026-10-06 owner decision).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # akivili has no git mirror yet; keep the default rewrite rules off.
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Setup sccache
      uses: mozilla/sccache-action@v0.0.4

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Compile check
      run: cargo check --workspace --all-targets

    - name: Clippy
      run: cargo clippy --workspace --lib --bins -- -D warnings

    - name: Tests
      run: cargo test --workspace

  wasm-fabric:
    # Same gate as the check job: the wasm fabric tests also ride the
    # self-hosted farm and must not run fork-controlled code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2
      - name: Compile check (tairitsu adapter)
        run: cargo check -p akivili_wasm_host --features tairitsu --all-targets
      - name: Clippy (tairitsu adapter)
        run: cargo clippy -p akivili_wasm_host --features tairitsu --all-targets -- -D warnings
      - name: Tests (tairitsu adapter)
        run: cargo test -p akivili_wasm_host --features tairitsu
      - name: Tests (loader wasm face)
        run: cargo test -p akivili_loader --features wasm
