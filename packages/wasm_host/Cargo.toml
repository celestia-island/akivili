[package]
name = "akivili-wasm-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Plugin fabric F1 adapter — the thin wasm_host crate over the tairitsu runtime (feature-gated; core akivili stays tairitsu-free)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = []
# The tairitsu-backed adapter: pulls the wasm runtime stack ONLY for
# hosts that opt in (the D9 weight discipline — registry/loader/ptc/
# plugin_host/guard never see wasmtime).
tairitsu = ["dep:tairitsu", "dep:wasmtime"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The published tairitsu line (0.5.22) still carries wasmtime ^47; the
# registry pin keeps this crate publishable (crates.io rejects git deps).
# The 0.5.23 line moves to wasmtime ^48 — bump both together once it ships.
tairitsu = { version = "^0.5", optional = true, features = ["dynamic"] }
wasmtime = { version = "^47", optional = true }

[dev-dependencies]
tokio = { version = "^1", features = ["rt", "macros"] }
wat = "^1"
# WIT contract gate (test-only): parses wit/host.wit so syntax errors
# and shape drift fail in CI, not at B2 bind time.
wit-parser = "^0.252"

[package.metadata.wit]
# The WIT contract ships in-tree; guests bind against
# packages/wasm_host/wit/host.wit (world celestia:host/guest).
world = "guest"
