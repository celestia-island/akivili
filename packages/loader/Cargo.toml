[package]
name = "akivili-loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Plugin fabric loader — unified lifecycle orchestration over the registry and the F1 wasm host, with a pluggable plugin-list source (evernight topology or own config)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
akivili-registry = { path = "../registry", version = "^0.2" }
anyhow.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

# The F1 outlet: only consumers who opt into wasm pull the runtime stack
# (the D9 weight discipline — the loader core itself stays tairitsu-free).
akivili-wasm-host = { path = "../wasm_host", version = "^0.2", optional = true }
# The F3 outlet: script plugins ride the boa PTC stack (plugin_host);
# hosts that never run scripts stay free of the JS engine.
akivili-plugin-host = { path = "../plugin_host", version = "^0.2", optional = true }

[features]
default = []
wasm = ["dep:akivili-wasm-host", "akivili-wasm-host/tairitsu"]
script = ["dep:akivili-plugin-host"]

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "^1", features = ["rt", "macros"] }
