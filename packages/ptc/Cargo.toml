[package]
name = "akivili-ptc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sandboxed TypeScript to JavaScript execution pipeline (SWC transpile + AST safety validation)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
anyhow.workspace = true
swc_core = { workspace = true, features = [
    "ecma_parser",
    "ecma_ast",
    "ecma_visit",
    "ecma_transforms_typescript",
    "ecma_codegen",
    "common",
] }

[dev-dependencies]
criterion = "^0.5"

[[bench]]
name = "ptc_bench"
harness = false
