[package]
name = "akivili-ptc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sandboxed TypeScript to JavaScript execution pipeline (SWC transpile + AST safety validation)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
anyhow.workspace = true
swc_core = { workspace = true, features = [
    "ecma_parser",
    "ecma_ast",
    "ecma_visit",
    "ecma_transforms_typescript",
    "ecma_codegen",
    "common",
] }

[dev-dependencies]
# T-F track item 1 (D6, _reports/tairitsu-hikari-wasi-browser-20261121/PLAN.md):
# default features would pull plotters -> plotters-backend/svg, dragging
# bindgen-family edges into the target-independent lock. cargo_bench_support
# alone keeps `cargo bench` (harness = false) working; measurement analysis
# runs without rayon.
criterion = { version = "^0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ptc_bench"
harness = false
